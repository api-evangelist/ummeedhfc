aid: ummeedhfc
name: Ummeed Housing Finance
description: >-
  Ummeed Housing Finance Pvt. Ltd. is an Indian affordable-housing finance
  company registered with the National Housing Bank (NHB), providing home
  loans, loans against property, business loans, and MSME business loans to
  low- and middle-income households. Headquartered in Gurgaon, Haryana, it
  operates 130+ branches across 9 states and has served 45,000+ families.
  Backed by Norwest Venture Partners. Ummeed publishes no public developer
  portal or API surface; its digital channels are the customer website and a
  customer mobile app.
